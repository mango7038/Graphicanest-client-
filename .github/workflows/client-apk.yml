name: GraphicaNest Client APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore persistent signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.CLIENT_SIGNING_KEYSTORE_BASE64 }}
          CLIENT_SIGNING_STORE_PASSWORD: ${{ secrets.CLIENT_SIGNING_STORE_PASSWORD }}
          CLIENT_SIGNING_KEY_ALIAS: ${{ secrets.CLIENT_SIGNING_KEY_ALIAS }}
          CLIENT_SIGNING_KEY_PASSWORD: ${{ secrets.CLIENT_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "::error::Missing persistent signing keystore. Do not ship an incompatible APK."; exit 1; }
          test -n "$CLIENT_SIGNING_STORE_PASSWORD"
          test -n "$CLIENT_SIGNING_KEY_ALIAS"
          test -n "$CLIENT_SIGNING_KEY_PASSWORD"
          printf %s "$SIGNING_KEYSTORE_BASE64" | base64 --decode > client-release.jks
          echo "CLIENT_SIGNING_KEYSTORE_FILE=$GITHUB_WORKSPACE/client-release.jks" >> "$GITHUB_ENV"
          echo "CLIENT_SIGNING_STORE_PASSWORD=$CLIENT_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CLIENT_SIGNING_KEY_ALIAS=$CLIENT_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CLIENT_SIGNING_KEY_PASSWORD=$CLIENT_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build permanently signed Client APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace --console=plain
      - name: Verify APK file
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk GraphicaNest-Client-preview.apk
          sha256sum GraphicaNest-Client-preview.apk
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "client-preview-${GITHUB_RUN_NUMBER}" GraphicaNest-Client-preview.apk \
            --target "$GITHUB_SHA" \
            --title "GraphicaNest Client Preview ${GITHUB_RUN_NUMBER}" \
            --notes "Persistently signed Client APK; existing debug-signed installations cannot be updated without their original signing key." \
            --prerelease
