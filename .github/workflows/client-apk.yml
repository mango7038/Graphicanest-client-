name: GraphicaNest Client APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build installable testing APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace --console=plain
      - name: Verify APK file
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk GraphicaNest-Client-preview.apk
          sha256sum GraphicaNest-Client-preview.apk
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "client-preview-${GITHUB_RUN_NUMBER}" GraphicaNest-Client-preview.apk \
            --target "$GITHUB_SHA" \
            --title "GraphicaNest Client Preview ${GITHUB_RUN_NUMBER}" \
            --notes "Fresh-install testing APK. Debug signing is not persistent across CI runs; uninstall old preview if signatures conflict. Do not use for production." \
            --prerelease
