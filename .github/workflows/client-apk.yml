name: GraphicaNest Client APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.CLIENT_SIGNING_KEYSTORE_BASE64 }}
          CLIENT_SIGNING_STORE_PASSWORD: ${{ secrets.CLIENT_SIGNING_STORE_PASSWORD }}
          CLIENT_SIGNING_KEY_ALIAS: ${{ secrets.CLIENT_SIGNING_KEY_ALIAS }}
          CLIENT_SIGNING_KEY_PASSWORD: ${{ secrets.CLIENT_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$CLIENT_SIGNING_STORE_PASSWORD" || -z "$CLIENT_SIGNING_KEY_ALIAS" || -z "$CLIENT_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Permanent keystore secrets missing. Refusing to publish another incompatible APK."
            exit 1
          fi
          printf %s "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/client-release.jks"
          echo "CLIENT_SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/client-release.jks" >> "$GITHUB_ENV"
          echo "CLIENT_SIGNING_STORE_PASSWORD=$CLIENT_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CLIENT_SIGNING_KEY_ALIAS=$CLIENT_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CLIENT_SIGNING_KEY_PASSWORD=$CLIENT_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build permanently signed release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace --console=plain
      - name: Verify APK file
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk GraphicaNest-Client-preview.apk
          sha256sum GraphicaNest-Client-preview.apk
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "client-signed-${GITHUB_RUN_NUMBER}" GraphicaNest-Client-preview.apk \
            --target "$GITHUB_SHA" \
            --title "GraphicaNest Client Signed ${GITHUB_RUN_NUMBER}" \
            --notes "Signed with permanent keystore. Existing debug APK installations signed by a different certificate cannot be updated." \
            --prerelease
